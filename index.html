<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <section class="formulario">
        <form  class="form_cadastro" action="" method="post">
            <h2>Formulário de Cadastro de Usuário</h2>
            <fieldset class="grupo_pessoais">
                <legend>Dados Pessoais</legend>
                <div class="item_form">
                    <label for="nome">Nome:*</label>
                    <input type="text" name="nome" id="nome" required placeholder="Digite seu nome">
                </div>
                <div class="item_form">
                    <label for="nome">Email:*</label>
                    <input type="email" name="email" id="email" required placeholder="Digite seu email">
                </div>
                <div class="item_form">
                    <label for="celular">Celular*:</label>
                    <input type="tel" name="telefone" id="telefone" required placeholder="Digite seu número de telefone">
                </div>
                <div class="item_form">
                    <label for="data">Data Nascimento*:</label>
                    <input type="date" name="date-nascimento" id="data" required placeholder="">
                </div>
                <div class="item_form">
                    <label for="descricao">Fale sobre seu desenvolvimento*:</label>
                    <textarea name="descricao" id="descricao"></textarea>
                </div>
            </fieldset>
            <fieldset class="gdados-profissionais">
                <legend>Dados Profissionais </legend>
                <div class="item_form">
                    <h3>Qual linguagem de programação voce domina?</h3>
                        <div class="container-radio">
                            <div class="item-radio">
                                <input type="radio" name="grupo-ling" id="Python" value="Python">
                                <label for="Python">Python</label>
                            </div>
                            <div class="item-radio">
                                <input type="radio" name="grupo-ling" id="Java" value="Java">
                                <label for="Java">Java</label>
                            </div>
                            <div class="item-radio">
                                <input type="radio" name="grupo-ling" id="C" value="C">
                                <label for="C">C</label>
                            </div>
                </div>
                </div>
                <div class="item_form">
                    <h3>Qual o seu nível de experiencia?</h3>
                    <select class="nivel-exp" name="nivel-exp" required>
                        <option value="" selected>Selecione o seu nível</option>
                        <option value="estagio">Estagiário</option>
                        <option value="junior">Junior</option>
                        <option value="pleno">Pleno</option>
                        <option value="senior">Senior</option>
                    </select>
                </div>
                <div class="item_form">
                    <h3>Qual a modalidade de trbalho?</h3>
                    <div class="container_checkbox">
                        <input type="checkbox" name="grupo-trab" id="hibrido" value="hibrido">
                        <label for="hibrido">Hibrido</label>
                        <input type="checkbox" name="grupo-trab" id="remoto" value="remoto">
                        <label for="remoto">Remoto</label>
                        <input type="checkbox" name="grupo-trab" id="presencial" value="presencial">
                        <label for="presencial">Presencial</label>
                    </div>
                </div>
            </fieldset>
            <fieldset class="gdados-profissionais">
                <legend>Crie sua conta</legend>

            <div class="item_form">
                <label for="username">Crie um usuário:* <br></label>
                <input type="text" name="username" id="username" placeholder="Nome de usuário" required>
            </div>

            <div class="item_form">
                <label for="senha">Crie uma senha:*<br></label>
                <input type="password" name="senha" id="senha" placeholder="Crie uma senha" required>
            </div>

            </fieldset>

            <br>
            <div class="botao">
                <input type="submit" value="Enviar">
                <input type="reset" value="Limpar">
            </div>
        </form>
    </section>
</body>
</html>
<script>
    document.querySelector(".form_cadastro").addEventListener("submit", function(event){
        event.preventDefault();
        alert("Formulário enviado com sucesso!");
    });
</script>
